name: daily-stock

on:
  schedule:
    - cron: "0 23* * 1-5"   # 평일 한국시간 08:00 (UTC 23:00)
  workflow_dispatch:         # 수동 실행 버튼

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python test.py
        env:
          MY_EMAIL_PW: ${{ secrets.MY_EMAIL_PW }}
      - uses: actions/upload-artifact@v4
        with:
          name: stock-csv
          path: electronic_equipment_multi.csv
